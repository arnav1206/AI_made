<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 4px;
            background: transparent;
            overflow: hidden;
        }
        .dictation-card {
            border-radius: 20px;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .mic-btn {
            background: linear-gradient(135deg, #FF7A00 0%, #EA580C 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 50px;
            padding: 0.85rem 2rem;
            font-size: 1.02rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 122, 0, 0.4);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .mic-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 28px rgba(255, 122, 0, 0.5);
        }
        .mic-btn.recording {
            background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            animation: pulse-recording 1.5s infinite;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
        }
        @keyframes pulse-recording {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .status-text {
            font-size: 0.86rem;
            margin-top: 0.8rem;
            font-weight: 600;
        }
        .live-box {
            margin-top: 0.85rem;
            border-radius: 12px;
            padding: 0.85rem;
            font-size: 1.02rem;
            min-height: 50px;
            text-align: left;
            line-height: 1.5;
            max-height: 80px;
            overflow-y: auto;
        }
        .interim {
            color: #FDE047;
            font-style: italic;
        }
        
        /* Dark Theme */
        .dark-theme .dictation-card {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #F8FAFC;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.4);
        }
        .dark-theme .status-text {
            color: #94A3B8;
        }
        .dark-theme .live-box {
            background: rgba(255, 255, 255, 0.06);
            color: #F8FAFC;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }
        .dark-theme .interim {
            color: #FDE047;
        }

        /* Light Theme */
        .light-theme .dictation-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            color: #0F172A;
            border: 2px solid #FED7AA;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .light-theme .status-text {
            color: #475569;
        }
        .light-theme .live-box {
            background: #FFFFFF;
            color: #0F172A;
            border: 1.5px solid #CBD5E1;
        }
        .light-theme .interim {
            color: #D97706;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="dictation-card">
        <button id="recordBtn" class="mic-btn" onclick="toggleDictation()">
            <span id="micIcon">🎙️</span> <span id="btnText">Start Live Dictation</span>
        </button>
        <div id="statusText" class="status-text">Tap button to start live voice transcription</div>
        <div id="liveOutput" class="live-box"><em>Live speech text will stream here as you speak...</em></div>
    </div>

    <script>
        const Streamlit = {
            setComponentValue: function(value) {
                window.parent.postMessage({
                    type: 'streamlit:setComponentValue',
                    value: value
                }, '*');
            },
            setFrameHeight: function(height) {
                window.parent.postMessage({
                    type: 'streamlit:setFrameHeight',
                    height: height
                }, '*');
            }
        };

        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';
        let targetLocale = "hi-IN";
        let languageName = "Hindi";
        let lastToggleTime = 0;

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                const args = event.data.args;
                targetLocale = args.locale || "hi-IN";
                languageName = args.language || "Hindi";
                
                if (args.is_dark) {
                    document.body.className = "dark-theme";
                } else {
                    document.body.className = "light-theme";
                }

                if (!isRecording) {
                    document.getElementById('btnText').innerText = "Start Live Dictation (" + languageName + ")";
                }
            }
        });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRecording = true;
                finalTranscript = '';
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('micIcon').innerText = '⏹';
                document.getElementById('btnText').innerText = "Stop & Use Live Speech";
                document.getElementById('statusText').innerText = "🗣️ Live recording in progress... Speak into mic";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                const fullDisplay = finalTranscript + '<span class="interim">' + interimTranscript + '</span>';
                document.getElementById('liveOutput').innerHTML = fullDisplay || '<em>Listening...</em>';

                const currentFullText = (finalTranscript + ' ' + interimTranscript).trim();
                if (currentFullText) {
                    Streamlit.setComponentValue(currentFullText);
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('statusText').innerText = '⚠️ Mic Error: ' + event.error;
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };
        } else {
            document.getElementById('statusText').innerText = '⚠️ Web Speech API not supported in this browser. Please use Chrome or Edge.';
        }

        function toggleDictation() {
            const now = Date.now();
            if (now - lastToggleTime < 400) return;
            lastToggleTime = now;

            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.lang = targetLocale;
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('micIcon').innerText = '🎙️';
            document.getElementById('btnText').innerText = "Start Live Dictation (" + languageName + ")";
            document.getElementById('statusText').innerText = "✅ Recording stopped. Live speech captured!";
        }

        Streamlit.setFrameHeight(210);
    </script>
</body>
</html>
