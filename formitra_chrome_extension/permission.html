<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Formitra — Grant Microphone Access</title>
  <style>
    body {
      background: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1E293B;
      border: 2px solid #FF7A00;
      border-radius: 16px;
      padding: 2.2rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    h2 { color: #FF7A00; margin-top: 0; font-size: 20px; }
    p { font-size: 14px; color: #CBD5E1; line-height: 1.6; }
    button {
      background: linear-gradient(135deg, #FF7A00, #EA580C);
      color: #FFF;
      border: none;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,122,0,0.4);
      margin-top: 1.2rem;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.04);
    }
    .status {
      margin-top: 1.2rem;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎙️ Grant Microphone Access for Formitra</h2>
    <p>Click the button below to allow Formitra to access your microphone for voice dictation and multilingual form auto-filling across all web forms and Google Forms.</p>
    <button id="grantBtn">🎙️ Click to Allow Microphone Permission</button>
    <div id="permStatus" class="status"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
